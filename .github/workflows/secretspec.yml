name: SecretSpec adapter CI

on:
  push:
    paths:
      - 'adapters/secretspec/**'
      - '.github/workflows/secretspec.yml'
      - 'README.md'
      - 'ROADMAP.md'
      - 'SECURITY.md'
      - 'adapters/README.md'
  pull_request:
    branches: [main]
    paths:
      - 'adapters/secretspec/**'
      - '.github/workflows/secretspec.yml'
      - 'README.md'
      - 'ROADMAP.md'
      - 'SECURITY.md'
      - 'adapters/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretspec-adapter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: SecretSpec IPC and real NEXUS-Q v4.1.2 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4

      - name: Checkout immutable NEXUS-Q v4.1.2 source
        uses: actions/checkout@v4
        with:
          repository: lecodev-26/nexus-q
          ref: 8735e5537bc687ee906ed68bdf119fc8956d9439
          path: nexus-q
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify formatting, unit tests and lints
        working-directory: adapters/secretspec
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build adapter and pinned NEXUS-Q service
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path adapters/secretspec/Cargo.toml
          cd nexus-q
          test "$(git rev-parse HEAD)" = "8735e5537bc687ee906ed68bdf119fc8956d9439"
          grep -q '^version = "4.1.2"$' Cargo.toml
          cargo build --locked --release -p nexusq-server -p nexusq-cli

      - name: Run real SecretSpec IPC and NEXUS-Q round trip
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SERVER="$GITHUB_WORKSPACE/nexus-q/target/release/nexusq-server"
          CLI="$GITHUB_WORKSPACE/nexus-q/target/release/nexusq"
          ADAPTER_BIN="$GITHUB_WORKSPACE/adapters/secretspec/target/release/secretspec-provider-nexusq"
          test -x "$SERVER"
          test -x "$CLI"
          test -x "$ADAPTER_BIN"

          export NEXUSQ_VAULT_PATH="$RUNNER_TEMP/nexusq-secretspec-test.nqx"
          export NEXUSQ_SERVER_TOKEN="$(openssl rand -hex 32)"
          export VAULT_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$NEXUSQ_SERVER_TOKEN"
          echo "::add-mask::$VAULT_PASSWORD"
          printf '%s' "$VAULT_PASSWORD" > "$RUNNER_TEMP/nexusq-vault-password"

          "$CLI" vault create "$NEXUSQ_VAULT_PATH" --password-file "$RUNNER_TEMP/nexusq-vault-password"
          KEY_JSON="$("$CLI" --output json key generate "$NEXUSQ_VAULT_PATH" \
            --algorithm aes256gcm --purpose encrypt \
            --password-file "$RUNNER_TEMP/nexusq-vault-password" --activate)"
          export NEXUSQ_KEY_ID="$(printf '%s' "$KEY_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["key_id"])')"
          test -n "$NEXUSQ_KEY_ID"

          export NEXUSQ_SERVER_ADDR="127.0.0.1:18444"
          export RUST_LOG="nexusq_server=warn"
          "$SERVER" > "$RUNNER_TEMP/nexusq-server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/nexusq-vault-password"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:18444/health >/dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/nexusq-server.log"
              exit 1
            fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:18444/health >/dev/null

          python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({"password": os.environ["VAULT_PASSWORD"]}).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:18444/v1/vault/unlock",
              data=body,
              headers={
                  "Authorization": "Bearer " + os.environ["NEXUSQ_SERVER_TOKEN"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=10) as response:
              if response.status != 204:
                  raise SystemExit("NEXUS-Q vault unlock did not return 204")
          PY

          export NEXUSQ_URL="http://127.0.0.1:18444"
          export NEXUSQ_TOKEN="$NEXUSQ_SERVER_TOKEN"
          export NEXUSQ_CONTEXT_ID="github-actions-secretspec-real-service-v1"
          export NEXUSQ_STORE_DIR="$RUNNER_TEMP/nexusq-secretspec-store"
          export ADAPTER_BIN
          python3 adapters/secretspec/tests/real_service_e2e.py
          test -z "$(find "$NEXUSQ_STORE_DIR" -type f -name '*.json' -print -quit)"
