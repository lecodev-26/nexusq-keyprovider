name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: false
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        if: matrix.go == '1.27.x'
        run: go test -race -count=1 ./...

  fuzz:
    name: Fuzz security boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - name: Fuzz metadata parser
        run: go test -run='^$' -fuzz=FuzzReadMetadata -fuzztime=20s
      - name: Fuzz NEXUS-Q URL validation
        run: go test -run='^$' -fuzz=FuzzValidateBaseURL -fuzztime=20s
      - name: Fuzz API response parser
        run: go test -run='^$' -fuzz=FuzzDecodeAPIResponse -fuzztime=20s

  cross-build:
    name: Cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/nexusq-keyprovider .

  e2e:
    name: OpenTofu E2E (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: AMD64
          - runner: ubuntu-24.04-arm
            arch: ARM64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: '1.13.2'
          tofu_wrapper: false
      - name: Run end-to-end integration suite
        run: bash integration/e2e.sh

  s3mock-e2e:
    name: OpenTofu S3 backend E2E (S3Mock)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: '1.13.2'
          tofu_wrapper: false
      - name: Check S3 backend HCL formatting
        run: tofu fmt -check integration/remote-s3.tf
      - name: Run S3-compatible backend integration suite
        run: bash integration/s3mock-e2e.sh

  nexusq-real-e2e:
    name: Real NEXUS-Q E2E (Linux AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout key provider
        uses: actions/checkout@v7.0.1
        with:
          path: nexusq-keyprovider
          persist-credentials: false
      - name: Checkout NEXUS-Q v4.1.2
        uses: actions/checkout@v7.0.1
        with:
          repository: lecodev-26/nexus-q
          ref: 8735e5537bc687ee906ed68bdf119fc8956d9439
          path: nexus-q
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: '1.13.2'
          tofu_wrapper: false
      - name: Build real NEXUS-Q CLI and server
        working-directory: nexus-q
        run: cargo build --locked --release -p nexusq-cli -p nexusq-server
      - name: Run real NEXUS-Q integration suite
        working-directory: nexusq-keyprovider
        env:
          NEXUSQ_SOURCE_DIR: ${{ github.workspace }}/nexus-q
        run: bash integration/nexusq-real-e2e.sh
